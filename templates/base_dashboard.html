{% extends "base.html" %}
{% block body %}
<div class="flex h-screen overflow-hidden">
  <!-- Mobile Sidebar Overlay -->
  <div class="fixed inset-0 bg-black/40 z-40 sidebar-overlay hidden lg:hidden" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-white border-r border-border-subtle flex flex-col transform -translate-x-full lg:translate-x-0 sidebar-panel" id="sidebar">
    <!-- Logo -->
    <div class="h-16 flex items-center gap-2 px-5 border-b border-border-subtle shrink-0">
      <span class="material-symbols-outlined text-primary text-2xl">engineering</span>
      <span class="text-lg font-serif font-semibold text-ink-primary tracking-tight">Mainten<span class="text-primary">X</span></span>
    </div>
    <!-- Role Badge -->
    <div class="px-5 pt-4 pb-2">
      <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold
        {% if role == 'admin' %}bg-accent-blue/20 text-[#2B4A5D]
        {% elif role == 'staff' %}bg-accent-tan/30 text-[#5C441E]
        {% else %}bg-primary/15 text-[#234231]{% endif %}">
        <span class="w-1.5 h-1.5 rounded-full
          {% if role == 'admin' %}bg-accent-blue
          {% elif role == 'staff' %}bg-accent-tan
          {% else %}bg-primary{% endif %}"></span>
        {{ role|capitalize }} Panel
      </span>
    </div>
    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
      {% block sidebar_nav %}{% endblock %}
    </nav>
    <!-- Logout -->
    <div class="px-3 py-4 border-t border-border-subtle">
      <a href="{{ url_for('auth.logout') }}" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-ink-muted hover:text-red-600 transition-colors">
        <span class="material-symbols-outlined text-xl">logout</span>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Top Bar -->
    <header class="h-16 bg-white border-b border-border-subtle flex items-center justify-between px-4 sm:px-6 shrink-0">
      <div class="flex items-center gap-3">
        <button class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-surface-container" onclick="toggleSidebar()">
          <span class="material-symbols-outlined text-xl">menu</span>
        </button>
        <h1 class="font-serif text-xl sm:text-2xl font-semibold text-ink-primary truncate">{% block page_title %}Dashboard{% endblock %}</h1>
      </div>
      <div class="flex items-center gap-3">
        <button class="p-2 rounded-lg hover:bg-surface-container relative">
          <span class="material-symbols-outlined text-xl text-ink-muted">notifications</span>
        </button>
        <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center text-sm font-semibold">
          {% block user_initial %}U{% endblock %}
        </div>
      </div>
    </header>
    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-bg-canvas">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script>
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('-translate-x-full');
  overlay.classList.toggle('hidden');
}
</script>
{% endblock %}
